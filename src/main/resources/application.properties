# app name
spring.application.name=sample-sales-app

# MySQL Database Setting
spring.datasource.url=jdbc:mysql://${DB_HOST_AND_PORT}/${DB_NAME}?useSSL=${DB_USE_SSL}&serverTimezone=${DB_SERVER_TIMEZONE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Extra Settings for JPA (Hibernate)

# create, update, create-drop, validate, none the database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect