# app name
spring.application.name=sample-sales-app


# MySQL Database Setting
spring.datasource.url=jdbc:mysql://<host>:<port>/<database_name>?useSSL=false&serverTimezone=UTC
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Extra Settings for JPA (Hibernate)

# create, update, create-drop, validate, none the database
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect